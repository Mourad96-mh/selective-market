<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <title>Selective Market — Parfums, Soins & Cosmétiques au Maroc</title>
    <meta
      name="description"
      content="Votre parfumerie en ligne au Maroc. Parfums, soins et cosmétiques des plus grandes marques. Livraison 48h partout au Maroc."
    />
    <meta
      name="google-site-verification"
      content="gpQvZ1Ohjsf1vdr59Olz2XbCB6bDKZT-aGVifH7blyw"
    />
    <!-- Geo -->
    <meta name="geo.region" content="MA-05" />
    <meta name="geo.placename" content="Casablanca, Maroc" />
    <meta name="geo.position" content="33.5731;-7.5898" />
    <meta name="ICBM" content="33.5731, -7.5898" />
    <link
      rel="alternate"
      hreflang="fr-MA"
      href="https://selective-market.com/"
    />

    <!-- Organization + LocalBusiness JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://selective-market.com/#organization",
            "name": "Selective Market",
            "url": "https://selective-market.com",
            "logo": "https://selective-market.com/favicon.svg",
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+212-663-432716",
              "contactType": "customer service",
              "availableLanguage": ["French", "Arabic"]
            },
            "sameAs": []
          },
          {
            "@type": "LocalBusiness",
            "@id": "https://selective-market.com/#localbusiness",
            "name": "Selective Market",
            "image": "https://selective-market.com/og-default.jpg",
            "telephone": "+212-663-432716",
            "email": "contact@selective-market.com",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Casablanca",
              "addressCountry": "MA"
            },
            "geo": {
              "@type": "GeoCoordinates",
              "latitude": 33.5731,
              "longitude": -7.5898
            },
            "url": "https://selective-market.com",
            "openingHoursSpecification": {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": [
                "Monday",
                "Tuesday",
                "Wednesday",
                "Thursday",
                "Friday",
                "Saturday"
              ],
              "opens": "09:00",
              "closes": "21:00"
            },
            "priceRange": "MAD"
          },
          {
            "@type": "WebSite",
            "@id": "https://selective-market.com/#website",
            "url": "https://selective-market.com",
            "name": "Selective Market",
            "inLanguage": "fr-MA",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://selective-market.com/produits?search={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
