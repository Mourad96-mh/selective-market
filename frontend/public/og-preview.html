<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>OG Preview — Selective Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
    }
    .og {
      width: 1200px;
      height: 630px;
      background: #1a1f3c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .og::before {
      content: '';
      position: absolute;
      top: -140px; right: -140px;
      width: 480px; height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,133,106,.09) 0%, transparent 70%);
    }
    .og::after {
      content: '';
      position: absolute;
      bottom: -100px; left: -100px;
      width: 360px; height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,133,106,.06) 0%, transparent 70%);
    }
    .logo-island {
      background: #ffffff;
      border-radius: 16px;
      padding: 18px 40px;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }
    .logo-island img {
      height: 110px;
      display: block;
    }
    .brand-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 52px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }
    .accent-line {
      width: 80px;
      height: 2px;
      background: #c9856a;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }
    .tagline {
      font-family: 'Jost', Arial, sans-serif;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #c9856a;
      position: relative;
      z-index: 1;
    }
    .hint {
      color: #555;
      font-family: sans-serif;
      font-size: 12px;
      text-align: center;
    }
    .hint code { color: #c9856a; }
  </style>
</head>
<body>
  <div class="og">
    <div class="logo-island">
      <img src="logo.png" alt="Selective Market">
    </div>
    <div class="brand-name">Selective Market</div>
    <div class="accent-line"></div>
    <div class="tagline">Parfums &amp; Cosmétiques Authentiques &middot; Maroc</div>
  </div>
  <p class="hint">
    Screenshot the box above at exactly 1200×630 px &rarr; save as <code>og-default.jpg</code> inside <code>frontend/public/</code>
  </p>
</body>
</html>
